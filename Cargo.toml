[workspace]
resolver = "2"
members = ["crates/shelv-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
repository = "https://github.com/eltam-nz/shelv-app"

[workspace.dependencies]
shelv-core = { path = "crates/shelv-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "11"
