[workspace]
resolver = "2"
members = ["crates/shelv-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false
repository = "https://github.com/eltam-nz/shelv-app"

[workspace.dependencies]
shelv-core = { path = "crates/shelv-core", version = "0.1.0" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
ts-rs = "11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight ordinary, readable code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Deny the ones that cause real bugs in a tool that moves files around:
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
