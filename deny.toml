# cargo-deny configuration. Run: cargo deny check
# Shelv is a local-only tool with no network surface beyond the updater, so the
# dependency surface is kept deliberately small (docs/PLAN.md §4, T9).

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are reported only for our own direct dependencies.
# Vulnerabilities are always denied, wherever they appear. The distinction
# matters because Tauri's transitive tree carries several unmaintained
# unicode crates we cannot act on; blanket-ignoring their advisory ids would
# also hide a future vulnerability in them.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licences only. Copyleft would constrain distribution of a binary
# we ship as a single installer.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing in a local backup tool should be opening sockets. If one of these
# appears in the tree, it arrived through a dependency and needs justifying.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
