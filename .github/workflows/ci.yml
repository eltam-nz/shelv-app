name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. `main` is excluded
# so the history of what passed there stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A backup tool has no business fetching anything at build time beyond its
  # declared dependencies.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Everything that does not need a Rust toolchain, so a formatting slip is
  # reported in a minute rather than after a full build.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Pastels on dark fail WCAG easily, and by eye they look fine. See
      # docs/PLAN.md §2.5.
      - run: pnpm check:contrast
      - run: pnpm build

  # Cheap invariants that do not need a build at all.
  boundaries:
    name: Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keeps OS-specific code inside platform/, which is what makes the
      # eventual Linux port cheap (docs/PLAN.md §2.6).
      - run: ./scripts/check-platform-boundary.sh

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shipping target.
          - os: windows-latest
          # Not a release target for v1, but building here is what stops the
          # platform abstraction rotting while nobody is looking.
          - os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # Tauri's Linux build needs a WebView and a GTK stack; Windows has
      # WebView2 already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # The frontend must exist before the Tauri crate compiles, because the
      # build script embeds ../dist.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: cargo fmt --all --check
      # --all-targets compiles the test binaries too, so a broken test still
      # fails the build on both platforms even where it is not executed.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # The shell crate's tests cannot run on Windows. Its test binary lands
      # in target\debug\deps\, but WebView2Loader.dll — a load-time import
      # of anything linking Tauri — is only copied next to the main binary in
      # target\debug\. The test binary then resolves a different loader from
      # PATH and dies with STATUS_ENTRYPOINT_NOT_FOUND before running a
      # single test.
      #
      # Nothing is lost by scoping this. Everything Windows-specific lives in
      # shelv-core, which is still fully tested here. The shell's tests cover
      # Tauri's ACL and parse JSON config — neither varies by platform, and
      # both run on Linux.
      - name: Test (core only — see comment)
        if: runner.os == 'Windows'
        run: cargo test -p shelv-core

      # Linux is not a release target for v1, so this exists only to prove
      # the whole workspace still links.
      - name: Build (link check)
        if: runner.os == 'Linux'
        run: cargo build --workspace --release

      # The shipped binary must be built through the Tauri CLI, never with a
      # bare `cargo build`. The CLI is what enables tauri's `custom-protocol`
      # feature; without it tauri's build script treats the build as a dev
      # build, embeds no frontend, and points the webview at `devUrl`. Such a
      # binary compiles and runs, then shows "localhost refused to connect"
      # on any machine without a dev server — which is every machine that
      # downloads an artifact.
      - name: Build the Windows application
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle

      # Nothing above fails when the frontend is missing, so assert it is
      # actually in there rather than trusting the command line.
      - name: Verify the frontend is embedded
        if: runner.os == 'Windows'
        run: node scripts/check-embedded-frontend.mjs target/release/shelv.exe

      # Makes the app testable without a Rust and Node toolchain, which is
      # otherwise the only way to get a runnable binary before M5 brings
      # installers. A portable exe rather than an installer: nothing to
      # install or uninstall, and the frontend is embedded in it, so it is
      # the whole app in one file.
      #
      # Unsigned, so Windows SmartScreen will warn on first run. That is
      # expected until the signing decision in docs/PLAN.md §3.4 is revisited.
      - name: Upload the Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shelv-windows-x64-${{ github.sha }}
          path: target/release/shelv.exe
          if-no-files-found: error
          retention-days: 14

      # Rust is the source of truth for the IPC types. Run it on one platform
      # only: the generated output does not vary by OS, and the check writes
      # into the working tree.
      - name: Check generated TypeScript is current
        if: runner.os == 'Linux'
        run: ./scripts/check-generated-types.sh

  # Separate job so an advisory published upstream does not mask a genuine
  # build failure, and vice versa.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Explicit so a new check type added upstream does not start
          # failing CI without anyone deciding to adopt it.
          arguments: --all-features
          command-arguments: advisories bans licenses sources
